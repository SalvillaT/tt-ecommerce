# TT E-commerce lakehouse Declarative Automation Bundle (Fases 2–3).
#
# Static bundle definition only: deploys/validates after the gates and a
# separate human authorization. No schedule on any job: jobs are manual and
# visible, one run at a time (job-level max_concurrent_runs=1) with retries 0.
# Run-as identities are bundle VARIABLES without secrets: the operator supplies
# the approved application (client) IDs at validate/deploy/run time. The Bronze
# run-as variable keeps its empty default (the Bronze job refuses empty
# inputs); the Silver run-as variable has NO default. Serverless environment is
# conditional: target `development_serverless` (default) attaches
# environment_key/spec; `development_classic` deliberately omits both when
# Serverless Jobs is not available (GF2-7 decision).
bundle:
  name: tt-ecommerce-bronze

include:
  - resources/*.yml

# Only ship what the jobs execute: the pipelines package and the root
# scripts. Tests, docs, infra, data fixtures and the operator scripts are
# never synchronized. The landing root is deployment configuration (bundle
# variable passed as a fixed task argument), never a run-editable job
# parameter.
sync:
  include:
    # Runtime only: pipeline code plus the Bronze ingestion root and its
    # isolated read-only DEMO-001 evidence verifier, and the Silver DEMO-001
    # materialization root and its read-only verifier (operator scripts stay
    # outside).
    - pipelines/**
    - scripts/run_bronze_job.py
    - scripts/verify_bronze_demo_001.py
    - scripts/run_silver_demo_001_job.py
    - scripts/verify_silver_demo_001.py
  exclude:
    - pipelines/**/codemap.md
    - tests/**
    - docs/**
    - data/**
    - infra/**
    - scripts/**/codemap.md
    - .slim/**

variables:
  run_as_service_principal_name:
    description: >-
      Application (client) ID of the approved run-as service principal.
      Supplied explicitly by the operator during validate/deploy/run (e.g.
      --var "run_as_service_principal_name=<sp-app-id>"); it is never a
      secret and is never stored in this bundle.
    default: ""
  landing_root:
    description: >-
      Fixed DEPLOYMENT configuration, not a run-editable parameter: non-secret
      abfss:// root of the landing filesystem (inside the granted external
      locations: landing/orders, customers, products and _control; never
      _staging). Example:
      abfss://landing@<storage_account>.dfs.core.windows.net
      The bundle passes it to the task as a FIXED argument
      (`--landing-root=${var.landing_root}`); the entrypoint validates it
      strictly as the exact container root (layout.validate_landing_root).
    default: ""
  silver_run_as_service_principal_name:
    description: >-
      Application (client) ID of the approved Silver DEMO-001 materialization
      run-as service principal (a DIFFERENT principal from the Bronze run-as;
      it must already hold the Phase 3 UC grants: catalog USE_CATALOG, Bronze
      USE_SCHEMA plus read-only SELECT on the three raw tables, and USE_SCHEMA
      plus CREATE_TABLE on silver/quarantine/gold). NO default: it must be
      supplied explicitly at validate/deploy/run time (e.g.
      --var "silver_run_as_service_principal_name=<sp-app-id>"); it is never a
      secret and is never stored in this bundle.
  environment_key:
    description: >-
      Serverless environment key used only by the development_serverless
      target. Do not change unless the serverless environment policy is
      reviewed.
    default: bronze_env
  classic_spark_version:
    description: >-
      Spark runtime for the development_classic fallback target; only used
      when serverless is unavailable AND GF2-7 classic compute is approved for
      every run. Keep versions aligned with the workspace LTS policy review.
    default: 15.4.x-scala2.12
  classic_node_type_id:
    description: >-
      Node type for the development_classic fallback job cluster (single
      worker, auto-terminated). Costed under GF2-7 per approval.
    default: Standard_E4s_v3

targets:
  development_serverless:
    default: true
    mode: development
    variables:
      environment_key: bronze_env
    resources:
      jobs:
        bronze_synthetic_ingestion_job:
          # Conditional serverless support: attached only in this target.
          environments:
            - environment_key: ${var.environment_key}
              spec:
                client: "1"
          tasks:
            - task_key: bronze_ingestion
              environment_key: ${var.environment_key}
        bronze_demo_001_verification_job:
          environments:
            - environment_key: ${var.environment_key}
              spec:
                client: "1"
          tasks:
            - task_key: bronze_demo_001_verification
              environment_key: ${var.environment_key}
        silver_demo_001_materialization_job:
          # Conditional serverless support: attached only in this target; both
          # ordered tasks run on the shared serverless environment.
          environments:
            - environment_key: ${var.environment_key}
              spec:
                client: "1"
          tasks:
            - task_key: silver_materialization
              environment_key: ${var.environment_key}
            - task_key: silver_demo_001_verify
              environment_key: ${var.environment_key}

  development_classic:
    mode: development
    # Serverless unavailable (GF2-7 fallback): the task keeps max_retries 0
    # and the job keeps max_concurrent_runs 1 and no schedule; compute is an
    # explicitly approved ephemeral classic job cluster with auto-termination.
    variables:
      classic_spark_version: 15.4.x-scala2.12
      classic_node_type_id: Standard_E4s_v3
    resources:
      jobs:
        bronze_synthetic_ingestion_job:
          job_clusters:
            - job_cluster_key: bronze_classic
              new_cluster:
                spark_version: ${var.classic_spark_version}
                node_type_id: ${var.classic_node_type_id}
                num_workers: 1
                data_security_mode: SINGLE_USER
                autotermination_minutes: 30
          tasks:
            - task_key: bronze_ingestion
              job_cluster_key: bronze_classic
        bronze_demo_001_verification_job:
          job_clusters:
            - job_cluster_key: bronze_verification_classic
              new_cluster:
                spark_version: ${var.classic_spark_version}
                node_type_id: ${var.classic_node_type_id}
                num_workers: 1
                data_security_mode: SINGLE_USER
                autotermination_minutes: 15
          tasks:
            - task_key: bronze_demo_001_verification
              job_cluster_key: bronze_verification_classic
        silver_demo_001_materialization_job:
          # Serverless unavailable (GF2-7 fallback): the controlled ephemeral
          # classic job cluster pattern, single worker, auto-terminating; the
          # job keeps max_concurrent_runs 1, no schedule and retries 0.
          job_clusters:
            - job_cluster_key: silver_classic
              new_cluster:
                spark_version: ${var.classic_spark_version}
                node_type_id: ${var.classic_node_type_id}
                num_workers: 1
                data_security_mode: SINGLE_USER
                autotermination_minutes: 30
          tasks:
            - task_key: silver_materialization
              job_cluster_key: silver_classic
            - task_key: silver_demo_001_verify
              job_cluster_key: silver_classic
